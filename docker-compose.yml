version: '3.8'

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: autopilot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build: .
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
    volumes:
      - .:/app
      - media:/app/media
      - static:/app/staticfiles

volumes:
  pgdata:
  media:
  static:
