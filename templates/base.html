<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoPilot — {% block title %}Plateforme de gestion{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <nav class="bg-white shadow-sm border-b">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <a href="/" class="text-xl font-bold text-blue-600">AutoPilot</a>
            <div class="space-x-4 text-sm">
                {% if user.is_authenticated %}
                    <span>{{ user.username }}</span>
                    <a href="/admin/" class="text-blue-600 hover:underline">Admin</a>
                    <a href="/admin/logout/" class="text-gray-600 hover:underline">Déconnexion</a>
                {% else %}
                    <a href="/admin/login/" class="text-blue-600 hover:underline">Connexion</a>
                {% endif %}
            </div>
        </div>
    </nav>
    <main class="max-w-7xl mx-auto px-4 py-6">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
