{% extends "layouts/app.html" %}
{% block title %}AutoPilot — Nouvelle session{% endblock %}
{% block content %}
<div class="mb-6">
    <nav class="flex mb-2 text-sm text-gray-500">
        <a href="/" class="hover:text-blue-600">Accueil</a><span class="mx-2">/</span>
        <a href="/sessions/" class="hover:text-blue-600">Sessions</a><span class="mx-2">/</span>
        <span class="text-gray-900 font-medium">Nouvelle</span>
    </nav>
    <h1 class="text-2xl font-bold text-gray-900">Nouvelle session</h1>
</div>
<form method="post" class="bg-white rounded-xl border border-gray-200 p-6 space-y-4 max-w-2xl">
    {% csrf_token %}
    <div><label class="block text-sm font-medium text-gray-700 mb-1">Formation *</label>
        <select name="formation_id" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500">
            <option value="">—</option>
            {% for f in formations %}<option value="{{ f.id }}">{{ f.code }} — {{ f.nom }}</option>{% endfor %}
        </select>
    </div>
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div><label class="block text-sm font-medium text-gray-700 mb-1">Code *</label><input type="text" name="code" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500"></div>
        <div><label class="block text-sm font-medium text-gray-700 mb-1">Nom</label><input type="text" name="nom" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500"></div>
    </div>
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div><label class="block text-sm font-medium text-gray-700 mb-1">Date de début *</label><input type="date" name="date_debut" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500"></div>
        <div><label class="block text-sm font-medium text-gray-700 mb-1">Date de fin *</label><input type="date" name="date_fin" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500"></div>
        <div><label class="block text-sm font-medium text-gray-700 mb-1">Capacité</label><input type="number" name="capacite" value="0" min="0" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500"></div>
    </div>
    <div class="flex gap-3 pt-4 border-t border-gray-200">
        <button type="submit" class="px-4 py-2 bg-blue-600 text-white text-sm font-medium rounded-lg hover:bg-blue-700">Enregistrer</button>
        <a href="/sessions/" class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50">Annuler</a>
    </div>
</form>
{% endblock %}
