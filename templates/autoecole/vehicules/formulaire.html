{% extends "layouts/app.html" %}
{% block title %}Nouveau véhicule{% endblock %}
{% block content %}
{% include "components/page_header.html" with title="Nouveau véhicule" back_url="vehicules_liste" %}

<form method="post" class="space-y-6 max-w-2xl">
    {% csrf_token %}
    <div class="bg-white rounded-xl border border-gray-200 p-6 space-y-4">
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Immatriculation</label>
                <input type="text" name="immatriculation" required class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm" placeholder="DK-001-AB">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Catégorie de permis</label>
                <select name="categorie_permis_id" required class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm">
                    <option value="">Sélectionner...</option>
                    {% for c in categories %}
                    <option value="{{ c.id }}">{{ c.code }} — {{ c.libelle }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Marque</label>
                <input type="text" name="marque" required class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm" placeholder="Toyota">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Modèle</label>
                <input type="text" name="modele" required class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm" placeholder="Corolla">
            </div>
        </div>
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Année</label>
                <input type="number" name="annee" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm" placeholder="2026">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Couleur</label>
                <input type="text" name="couleur" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm" placeholder="Blanc">
            </div>
        </div>
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Type de boîte</label>
                <select name="type_boite" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm">
                    <option value="MANUELLE">Manuelle</option>
                    <option value="AUTOMATIQUE">Automatique</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Carburant</label>
                <select name="type_carburant" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm">
                    <option value="">Sélectionner...</option>
                    <option value="ESSENCE">Essence</option>
                    <option value="DIESEL">Diesel</option>
                    <option value="ELECTRIQUE">Électrique</option>
                    <option value="HYBRIDE">Hybride</option>
                    <option value="AUTRE">Autre</option>
                </select>
            </div>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Kilométrage actuel</label>
            <input type="number" name="kilometrage" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm" placeholder="0" value="0">
        </div>
    </div>
    <div class="flex gap-3">
        <button type="submit" class="px-4 py-2 bg-blue-600 text-white text-sm font-medium rounded-lg hover:bg-blue-700">Enregistrer</button>
        <a href="{% url 'vehicules_liste' %}" class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50">Annuler</a>
    </div>
</form>
{% endblock %}
