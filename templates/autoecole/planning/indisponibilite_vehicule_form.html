{% extends "layouts/app.html" %}
{% block title %}Nouvelle indisponibilité véhicule{% endblock %}
{% block content %}
{% include "components/page_header.html" with title="Nouvelle indisponibilité" back_url="indisponibilites_vehicule_liste" %}

<form method="post" class="max-w-lg">
    {% csrf_token %}
    <div class="bg-white rounded-xl border border-gray-200 p-6 space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Véhicule</label>
            <select name="vehicule_id" required class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm">
                {% for v in vehicules %}<option value="{{ v.id }}">{{ v.marque }} — {{ v.immatriculation }}</option>{% endfor %}
            </select>
        </div>
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Début</label>
                <input type="datetime-local" name="date_debut" required class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Fin</label>
                <input type="datetime-local" name="date_fin" required class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm">
            </div>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Motif</label>
            <input type="text" name="motif" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm" placeholder="Panne, entretien, etc.">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Commentaire</label>
            <textarea name="commentaire" rows="3" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm"></textarea>
        </div>
    </div>
    <div class="flex gap-3 mt-6">
        <button type="submit" class="px-4 py-2 bg-blue-600 text-white text-sm font-medium rounded-lg hover:bg-blue-700">Créer</button>
        <a href="{% url 'indisponibilites_vehicule_liste' %}" class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50">Annuler</a>
    </div>
</form>
{% endblock %}
