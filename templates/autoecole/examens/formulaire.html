{% extends "layouts/app.html" %}
{% block title %}Planifier un examen{% endblock %}
{% block content %}
{% include "components/page_header.html" with title="Planifier un examen" back_url="examens_liste" %}

<div class="max-w-2xl mx-auto bg-white rounded-xl border border-gray-200 p-6">
    <form method="post" class="space-y-4">
        {% csrf_token %}
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Dossier candidat</label>
            <select name="dossier" required class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm">
                <option value="">Sélectionner un dossier...</option>
                {% for d in dossiers %}
                <option value="{{ d.id }}">{{ d.inscription.apprenant }} — {{ d.categorie_permis.code }} (#{{ d.numero_dossier }})</option>
                {% endfor %}
            </select>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Type d'examen</label>
            <select name="type_examen" required class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm">
                <option value="">Sélectionner...</option>
                {% for t in TypeExamen %}
                <option value="{{ t.value }}">{{ t.label }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Date</label>
                <input type="date" name="date_examen" required class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Heure</label>
                <input type="time" name="heure_examen" value="08:00" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm">
            </div>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Centre d'examen</label>
            <input type="text" name="centre_examen" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm" placeholder="Ex: Centre d'examen de Bamako">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Numéro de convocation</label>
            <input type="text" name="numero_convocation" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm" placeholder="Optionnel">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Observation</label>
            <textarea name="observation" rows="3" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm" placeholder="Optionnel"></textarea>
        </div>
        <div class="flex justify-end gap-3 pt-4">
            <a href="{% url 'examens_liste' %}" class="px-4 py-2 text-sm border border-gray-300 rounded-lg hover:bg-gray-50">Annuler</a>
            <button type="submit" class="px-4 py-2 text-sm bg-blue-600 text-white rounded-lg hover:bg-blue-700">Planifier</button>
        </div>
    </form>
</div>
{% endblock %}
