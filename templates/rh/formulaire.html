{% extends "layouts/app.html" %}
{% block title %}Nouvel employé{% endblock %}
{% block content %}
{% include "components/page_header.html" with title="Nouvel employé" back_url="employes_liste" %}

<form method="post" class="space-y-6 max-w-2xl">
    {% csrf_token %}
    <div class="bg-white rounded-xl border border-gray-200 p-6 space-y-4">
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Nom</label>
                <input type="text" name="last_name" required class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm" placeholder="DIALLO">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Prénom</label>
                <input type="text" name="first_name" required class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm" placeholder="Mamadou">
            </div>
        </div>
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Sexe</label>
                <select name="sex" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm">
                    <option value="M">Masculin</option>
                    <option value="F">Féminin</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Date de naissance</label>
                <input type="date" name="birth_date" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm">
            </div>
        </div>
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Téléphone</label>
                <input type="text" name="phone" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm" placeholder="+221 77 000 00 00">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input type="email" name="email" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm" placeholder="employe@exemple.com">
            </div>
        </div>
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Département</label>
                <select name="department_id" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm">
                    <option value="">Sélectionner...</option>
                    {% for d in departments %}
                    <option value="{{ d.id }}">{{ d.code }} — {{ d.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Poste</label>
                <select name="position_id" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm">
                    <option value="">Sélectionner...</option>
                    {% for p in positions %}
                    <option value="{{ p.id }}">{{ p.code }} — {{ p.title }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Type de contrat</label>
                <select name="contract_type" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm">
                    <option value="CDI">CDI</option>
                    <option value="CDD">CDD</option>
                    <option value="internship">Stage</option>
                    <option value="consultant">Consultant</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Date d'embauche</label>
                <input type="date" name="hire_date" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm">
            </div>
        </div>
    </div>
    <div class="flex gap-3">
        <button type="submit" class="px-4 py-2 bg-blue-600 text-white text-sm font-medium rounded-lg hover:bg-blue-700">Enregistrer</button>
        <a href="{% url 'employes_liste' %}" class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50">Annuler</a>
    </div>
</form>
{% endblock %}
