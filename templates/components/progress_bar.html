<div>
    {% if label %}
    <div class="flex justify-between items-center mb-1">
        <span class="text-sm font-medium text-gray-700">{{ label }}</span>
        <span class="text-sm font-medium {% if value >= 100 %}text-green-600{% else %}text-gray-500{% endif %}">{{ value|floatformat:0 }}%</span>
    </div>
    {% endif %}
    <div class="w-full bg-gray-200 rounded-full h-2.5">
        <div class="h-2.5 rounded-full transition-all duration-500
            {% if value >= 100 %}bg-green-500
            {% elif value >= 75 %}bg-blue-500
            {% elif value >= 50 %}bg-yellow-500
            {% else %}bg-orange-500{% endif %}"
             style="width: {{ value|floatformat:0 }}%">
        </div>
    </div>
</div>
