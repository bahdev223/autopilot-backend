{% if page_obj and page_obj.paginator.num_pages > 1 %}
<div class="px-6 py-3 border-t border-gray-200 flex items-center justify-between">
    <p class="text-sm text-gray-500">
        Page {{ page_obj.number }} sur {{ page_obj.paginator.num_pages }}
        ({{ page_obj.paginator.count }} résultats)
    </p>
    <div class="flex gap-1">
        {% if page_obj.has_previous %}
            <a href="?page={{ page_obj.previous_page_number }}{% for key, value in request.GET.items %}{% if key != 'page' %}&{{ key }}={{ value }}{% endif %}{% endfor %}"
               class="px-3 py-1 text-sm border border-gray-300 rounded-md hover:bg-gray-50 transition-colors">Précédent</a>
        {% endif %}
        {% if page_obj.has_next %}
            <a href="?page={{ page_obj.next_page_number }}{% for key, value in request.GET.items %}{% if key != 'page' %}&{{ key }}={{ value }}{% endif %}{% endfor %}"
               class="px-3 py-1 text-sm border border-gray-300 rounded-md hover:bg-gray-50 transition-colors">Suivant</a>
        {% endif %}
    </div>
</div>
{% endif %}
