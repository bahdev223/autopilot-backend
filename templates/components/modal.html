<div x-show="modalOpen" x-data="{ modalOpen: false }"
     @modal-confirm.window="modalOpen = true"
     x-effect="if(modalOpen) { document.body.classList.add('overflow-hidden') } else { document.body.classList.remove('overflow-hidden') }"
     class="fixed inset-0 z-50 flex items-center justify-center p-4" style="display: none;">
    <div x-show="modalOpen" x-transition:enter="ease-out duration-200" x-transition:leave="ease-in duration-150"
         @click="modalOpen = false" class="fixed inset-0 bg-black bg-opacity-50"></div>
    <div x-show="modalOpen" x-transition:enter="ease-out duration-200" x-transition:leave="ease-in duration-150"
         class="relative bg-white rounded-xl shadow-2xl max-w-lg w-full p-6 z-10">
        <div class="mb-4">
            <h3 class="text-lg font-semibold text-gray-900" x-text="modalTitle || 'Confirmation'"></h3>
            <p class="text-sm text-gray-500 mt-1" x-text="modalMessage || 'Confirmez-vous cette action ?'"></p>
        </div>
        <div x-show="modalMotif" class="mb-4" style="display: none;">
            <label class="block text-sm font-medium text-gray-700 mb-1">Motif</label>
            <textarea x-model="modalMotifValue" rows="2" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500"></textarea>
        </div>
        <div class="flex justify-end gap-3">
            <button @click="modalOpen = false" class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors">Annuler</button>
            <button @click="modalConfirm(); modalOpen = false" class="px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded-lg hover:bg-blue-700 transition-colors">Confirmer</button>
        </div>
    </div>
</div>

<script>
window.modalTitle = '';
window.modalMessage = '';
window.modalMotif = false;
window.modalMotifValue = '';
window.modalCallback = null;

function openModal(title, message, callback, showMotif = false) {
    window.modalTitle = title;
    window.modalMessage = message;
    window.modalMotif = showMotif;
    window.modalMotifValue = '';
    window.modalCallback = callback;
    window.dispatchEvent(new CustomEvent('modal-confirm'));
}

function modalConfirm() {
    if (typeof window.modalCallback === 'function') {
        window.modalCallback(window.modalMotifValue);
    }
}
</script>
