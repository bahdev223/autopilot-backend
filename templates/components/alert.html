<div x-data="{ show: true }" x-show="show" x-init="setTimeout(() => show = false, 5000)"
     class="mb-4 px-4 py-3 rounded-lg border text-sm flex items-center justify-between
     {% if message.tags == 'error' or level == 40 %}bg-red-50 border-red-200 text-red-700
     {% elif message.tags == 'warning' or level == 30 %}bg-yellow-50 border-yellow-200 text-yellow-700
     {% elif message.tags == 'success' or level == 25 %}bg-green-50 border-green-200 text-green-700
     {% else %}bg-blue-50 border-blue-200 text-blue-700{% endif %}">
    <span>{{ message }}</span>
    <button @click="show = false" class="ml-3 hover:opacity-75">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
    </button>
</div>
