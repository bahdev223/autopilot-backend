{% extends "layouts/app.html" %}
{% block title %}AutoPilot — Supprimer l'écriture{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto mt-8">
    <div class="bg-white rounded-xl border border-gray-200 p-6 text-center">
        <div class="w-16 h-16 mx-auto mb-4 rounded-full bg-red-100 flex items-center justify-center"><svg class="w-8 h-8 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-2.009-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg></div>
        <h1 class="text-xl font-bold text-gray-900 mb-2">Confirmer la suppression</h1>
        <p class="text-gray-600 mb-2">Voulez-vous vraiment supprimer l'écriture <strong>{{ ecriture.reference }}</strong> ?</p>
        <p class="text-sm text-gray-500 mb-6">Cette action est irréversible.</p>
        <form method="post">
            {% csrf_token %}
            <div class="flex justify-center gap-3">
                <a href="{% url 'ecriture_fiche' ecriture.pk %}" class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors">Annuler</a>
                <button type="submit" class="px-4 py-2 bg-red-600 text-white text-sm font-medium rounded-lg hover:bg-red-700 transition-colors">Confirmer la suppression</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
