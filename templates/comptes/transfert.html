{% extends "layouts/app.html" %}
{% block title %}AutoPilot — Transfert{% endblock %}
{% block content %}
<div class="mb-6">
    <nav class="flex mb-2 text-sm text-gray-500"><a href="/" class="hover:text-blue-600">Accueil</a><span class="mx-2">/</span><a href="{% url 'comptes_dashboard' %}" class="hover:text-blue-600">Comptes</a><span class="mx-2">/</span><span class="text-gray-900 font-medium">Transfert</span></nav>
    <h1 class="text-2xl font-bold text-gray-900">Transfert entre Comptes</h1>
</div>

<form method="post" class="bg-white rounded-xl border border-gray-200 p-6 space-y-5 max-w-lg">
    {% csrf_token %}
    <div><label class="block text-sm font-medium text-gray-700 mb-1">Source *</label><select name="source_id" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500"><option value="">Sélectionner</option>{% for c in comptes %}<option value="{{ c.id }}">{{ c.nom }} ({{ c.solde_actuel|floatformat:0 }} {{ c.devise }})</option>{% endfor %}</select></div>
    <div><label class="block text-sm font-medium text-gray-700 mb-1">Destination *</label><select name="dest_id" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500"><option value="">Sélectionner</option>{% for c in comptes %}<option value="{{ c.id }}">{{ c.nom }}</option>{% endfor %}</select></div>
    <div><label class="block text-sm font-medium text-gray-700 mb-1">Montant *</label><input type="number" step="0.01" name="montant" required placeholder="0" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500"></div>
    <div><label class="block text-sm font-medium text-gray-700 mb-1">Notes</label><textarea name="notes" rows="2" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500" placeholder="Motif du transfert..."></textarea></div>
    <div class="flex gap-3 pt-2">
        <button type="submit" class="px-5 py-2 bg-blue-600 text-white text-sm font-medium rounded-lg hover:bg-blue-700 transition-colors">Effectuer le transfert</button>
        <a href="{% url 'comptes_dashboard' %}" class="px-5 py-2 bg-gray-100 text-gray-700 text-sm font-medium rounded-lg hover:bg-gray-200 transition-colors">Annuler</a>
    </div>
</form>
{% endblock %}
