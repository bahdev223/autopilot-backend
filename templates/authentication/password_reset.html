{% extends "layouts/auth.html" %}
{% block title %}AutoPilot — Mot de passe oublié{% endblock %}
{% block content %}
<form method="post" action="{% url 'mot_de_passe_oublie' %}" class="space-y-5">
    {% csrf_token %}
    <div class="text-center mb-2">
        <p class="text-sm text-gray-600">Saisissez votre adresse email pour recevoir un lien de réinitialisation.</p>
    </div>

    <div>
        <label for="id_email" class="block text-sm font-medium text-gray-700 mb-1">Adresse email</label>
        <input type="email" name="email" id="id_email" required autocomplete="email" autofocus
               class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
               placeholder="exemple@auto-ecole.com">
    </div>

    <button type="submit" class="w-full bg-blue-600 text-white font-medium py-2.5 rounded-lg hover:bg-blue-700 transition-colors focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
        Envoyer le lien
    </button>

    <p class="text-center text-sm text-gray-500">
        <a href="{% url 'connexion' %}" class="text-blue-600 hover:underline">Retour à la connexion</a>
    </p>
</form>
{% endblock %}
