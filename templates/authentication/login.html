{% extends "layouts/auth.html" %}
{% block title %}AutoPilot — Connexion{% endblock %}
{% block content %}
<form method="post" action="{% url 'connexion' %}" class="space-y-5">
    {% csrf_token %}

    {% if form.non_field_errors %}
        <div class="bg-red-50 border border-red-200 text-red-700 text-sm px-4 py-3 rounded-lg">
            {% for error in form.non_field_errors %}
                <p>{{ error }}</p>
            {% endfor %}
        </div>
    {% endif %}

    <div>
        <label for="id_username" class="block text-sm font-medium text-gray-700 mb-1">Email ou identifiant</label>
        <input type="text" name="username" id="id_username" required autocomplete="username" autofocus
               class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
               placeholder="exemple@auto-ecole.com">
    </div>

    <div>
        <label for="id_password" class="block text-sm font-medium text-gray-700 mb-1">Mot de passe</label>
        <input type="password" name="password" id="id_password" required autocomplete="current-password"
               class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
               placeholder="Votre mot de passe">
    </div>

    <div class="flex items-center justify-between">
        <label class="flex items-center text-sm text-gray-600">
            <input type="checkbox" name="remember" class="rounded border-gray-300 text-blue-600 focus:ring-blue-500 mr-2">
            Se souvenir de moi
        </label>
        <a href="{% url 'mot_de_passe_oublie' %}" class="text-sm text-blue-600 hover:underline">Mot de passe oublié ?</a>
    </div>

    <button type="submit" class="w-full bg-blue-600 text-white font-medium py-2.5 rounded-lg hover:bg-blue-700 transition-colors focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
        Se connecter
    </button>
</form>
{% endblock %}
